name: Bug report
description: Something in nextx does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nextx --version`
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, and how you installed it (install script, Homebrew, Scoop, npm)
      placeholder: macOS 15 arm64, Homebrew
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, with secrets removed
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `nextx doctor`
      render: shell
